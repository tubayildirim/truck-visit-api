# Sample manifest for the Truck Visit API.
#
# The case asks only that the deployment approach be explained, so this is illustrative rather
# than a cluster-ready package — a real one would be a Helm chart or a Kustomize overlay per
# environment. What it does show is which decisions the operational requirements force:
# 99.95% availability, 300 requests per second at peak, and a database that fails over.

---
apiVersion: v1
kind: Service
metadata:
  name: truckvisit-api
  labels:
    app.kubernetes.io/name: truckvisit-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: truckvisit-api
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truckvisit-api
  labels:
    app.kubernetes.io/name: truckvisit-api
spec:
  # Three, not one. 99.95% allows roughly 4.4 hours of downtime a year, and a single replica
  # spends more than that on ordinary rolling deploys and node drains.
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: truckvisit-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the declared capacity during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truckvisit-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198          # the 'app' user baked into the chiselled base image
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault

      # Spread across availability zones. Without this the scheduler is free to put all three
      # replicas in one zone, and a zonal outage takes the whole service with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: truckvisit-api

      containers:
        - name: api
          image: truckvisit-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Never inline. In AWS this is wired to Secrets Manager through the External Secrets
            # operator or the CSI driver, so the credential is rotated without a redeploy.
            - name: ConnectionStrings__TruckVisit
              valueFrom:
                secretKeyRef:
                  name: truckvisit-api-secrets
                  key: connection-string
            - name: Authentication__Schemes__Bearer__Authority
              valueFrom:
                configMapKeyRef:
                  name: truckvisit-api-config
                  key: jwt-authority

          # Liveness asks "is this process wedged?" and runs no dependency checks. Readiness asks
          # "should this instance take traffic?" and does check the database. Conflating them is
          # how an RDS failover turns into every replica restarting at once.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2

          # Gives the app time to warm up without the liveness probe killing it mid-start.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: CFS throttling at the limit adds tail latency exactly
              # during the traffic peaks this service is sized for. The request guarantees a
              # share; the memory limit still bounds the blast radius of a leak.
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          lifecycle:
            preStop:
              # Endpoint removal and pod termination race each other. The pause lets the load
              # balancer stop sending work before the process goes away, so a deploy does not
              # hand a gate operator a connection reset.
              sleep:
                seconds: 5

      terminationGracePeriodSeconds: 30

      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: truckvisit-api
spec:
  # Node drains and cluster upgrades are voluntary disruptions; this keeps them from taking the
  # service below two healthy replicas.
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: truckvisit-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: truckvisit-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: truckvisit-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      # Gate traffic arrives in bursts when a vessel berths. Scaling up slowly means the peak is
      # served by the replicas that were already there.
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
